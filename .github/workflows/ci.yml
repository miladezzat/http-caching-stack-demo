name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: caching_demo_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U demo -d caching_demo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify external PostgreSQL adapter
        run: node --test tests/api.test.cjs
        env:
          TEST_DATABASE_URL: postgresql://demo:demo@127.0.0.1:5432/caching_demo_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
